<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="An always-on-top caption card floating over a window: a thin tool row with the close button on the right, then two captions separated by dashed rules, each showing the recognised source line above the larger translated line">
  <!-- the window behind the overlay -->
  <rect x="64" y="20" width="512" height="216" rx="16" fill="#eef2f8" stroke="#cfd8e6" stroke-width="1.5"/>
  <circle cx="88" cy="46" r="4" fill="#c3cddd"/>
  <circle cx="102" cy="46" r="4" fill="#c3cddd"/>
  <circle cx="116" cy="46" r="4" fill="#c3cddd"/>
  <rect x="88" y="64" width="300" height="10" rx="5" fill="#d9e1ed"/>
  <rect x="88" y="84" width="232" height="10" rx="5" fill="#d9e1ed"/>

  <!-- caption card: tool row, then two bilingual captions -->
  <rect x="88" y="96" width="464" height="148" rx="14" fill="#20252c" stroke="#39445a" stroke-width="1.5"/>

  <!-- tool row: font, opacity, source toggle, lock, then close at the right -->
  <rect x="104" y="112" width="24" height="15" rx="4" fill="#39445a"/>
  <rect x="133" y="112" width="24" height="15" rx="4" fill="#39445a"/>
  <rect x="162" y="112" width="24" height="15" rx="4" fill="#39445a"/>
  <rect x="191" y="112" width="24" height="15" rx="4" fill="#39445a"/>
  <rect x="220" y="112" width="34" height="15" rx="4" fill="#39445a"/>
  <rect x="259" y="112" width="24" height="15" rx="4" fill="#39445a"/>
  <rect x="516" y="112" width="16" height="15" rx="4" fill="#39445a"/>
  <rect x="104" y="138" width="432" height="1.5" rx="0.75" fill="#2b3342"/>

  <!-- first caption: time code, source line, translated line -->
  <rect x="104" y="154" width="26" height="6" rx="3" fill="#5a6474"/>
  <rect x="142" y="150" width="196" height="8" rx="4" fill="#7f8da6"/>
  <rect x="142" y="166" width="300" height="12" rx="6" fill="#f2f6fd"/>

  <!-- dashed rule between captions -->
  <line x1="104" y1="190" x2="536" y2="190" stroke="#3a4456" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- second caption -->
  <rect x="104" y="206" width="26" height="6" rx="3" fill="#5a6474"/>
  <rect x="142" y="202" width="168" height="8" rx="4" fill="#7f8da6"/>
  <rect x="142" y="218" width="262" height="12" rx="6" fill="#f2f6fd"/>
</svg>
